<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="90" fill="url(#gradient)" stroke="black" stroke-width="5"/>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="gradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#007bff"/>
      <stop offset="100%" stop-color="#0056b3"/>
    </linearGradient>
  </defs>

  <!-- "NGS" 文字 -->
  <text x="50" y="85" font-family="Arial" font-size="40" font-weight="bold" fill="white">NGS</text>

  <!-- "LLM" 文字 -->
  <text x="60" y="140" font-family="Arial" font-size="35" font-weight="bold" fill="white">LLM</text>

  <!-- 智能科技的连线效果 -->
  <line x1="20" y1="20" x2="180" y2="180" stroke="white" stroke-width="3" stroke-dasharray="5,5"/>
  <line x1="20" y1="180" x2="180" y2="20" stroke="white" stroke-width="3" stroke-dasharray="5,5"/>
  <circle cx="100" cy="100" r="8" fill="white" stroke="black" stroke-width="2"/>
</svg>
